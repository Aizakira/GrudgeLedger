name: Lua 5.1 tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install --target test-runtime -r requirements-test.txt
      - run: python tests/run_tests.py
      - name: Check UI geometry on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install Pillow==12.1.1
          python visual-qa/render.py

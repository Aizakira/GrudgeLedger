name: Prepare addon ZIP

on:
  workflow_dispatch:
    inputs:
      source:
        description: Addon branch, tag or full commit SHA
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out selected addon revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source }}
          path: source
          persist-credentials: false
      - name: Build and check the installable ZIP
        run: python3 -I tools/package_addon.py source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/GrudgeLedger-*.zip
          archive: false
          if-no-files-found: error
